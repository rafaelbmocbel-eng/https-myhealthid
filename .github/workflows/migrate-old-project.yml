name: Migrar dados do projeto antigo

on:
  workflow_dispatch: {}

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar postgresql-client
        run: sudo apt-get install -y postgresql-client -q

      - name: Verificar secrets configurados
        env:
          OLD_DB: ${{ secrets.SUPABASE_OLD_DB_URL }}
          NEW_DB: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$OLD_DB" ]; then
            echo "❌ ERRO: SUPABASE_OLD_DB_URL não configurado!"
            exit 1
          fi
          if [ -z "$NEW_DB" ]; then
            echo "❌ ERRO: SUPABASE_DB_URL não configurado!"
            exit 1
          fi
          # Mostrar host/user sem expor a senha
          echo "OLD_DB host: $(echo "$OLD_DB" | sed 's|.*@||' | cut -d'/' -f1)"
          echo "OLD_DB user: $(echo "$OLD_DB" | sed 's|postgresql://||' | cut -d':' -f1)"
          echo "✅ Ambos os secrets estão configurados"

      - name: Testar conexão com banco antigo
        env:
          OLD_DB: ${{ secrets.SUPABASE_OLD_DB_URL }}
        run: |
          echo "Testando conexão com banco antigo..."
          RESULT=$(psql "$OLD_DB" -c "SELECT version();" -t 2>&1)
          EXIT_CODE=$?
          echo "$RESULT"
          if [ $EXIT_CODE -ne 0 ]; then
            echo ""
            echo "❌ FALHA na conexão (exit code: $EXIT_CODE)"
            echo ""
            echo "Diagnóstico:"
            echo "  1. Verifique se a senha no secret SUPABASE_OLD_DB_URL está correta"
            echo "  2. No Supabase antigo: Settings → Database → Reset password"
            echo "  3. Atualize o secret com a nova senha e rode novamente"
            exit 1
          fi
          echo "✅ Conexão OK"

      - name: Testar conexão com banco novo
        env:
          NEW_DB: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          echo "Testando conexão com banco novo..."
          RESULT=$(psql "$NEW_DB" -c "SELECT version();" -t 2>&1)
          EXIT_CODE=$?
          echo "$RESULT"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "❌ FALHA na conexão com banco novo (exit code: $EXIT_CODE)"
            exit 1
          fi
          echo "✅ Conexão OK"

      - name: Migrar tabelas com terapeuta_id
        env:
          OLD_DB: ${{ secrets.SUPABASE_OLD_DB_URL }}
          NEW_DB: ${{ secrets.SUPABASE_DB_URL }}
          OLD_TID: "808647e5-1d3b-4e3a-8886-d835b1117e2c"
          NEW_TID: "44266838-326c-452d-bebf-e617ac0f3470"
        run: |
          set +e
          echo "=== Descobrindo tabelas com terapeuta_id ==="
          TABLES=$(psql "$OLD_DB" -t -A -c "
            SELECT table_name
            FROM information_schema.columns
            WHERE column_name = 'terapeuta_id'
              AND table_schema = 'public'
              AND table_name NOT IN ('pacientes', 'agendamentos', 'profiles')
            ORDER BY table_name;
          ")

          echo "Tabelas encontradas:"
          echo "$TABLES"

          for TABLE in $TABLES; do
            echo ""
            echo "=== Migrando: $TABLE ==="

            OLD_COUNT=$(psql "$OLD_DB" -t -A -c \
              "SELECT COUNT(*) FROM public.\"$TABLE\" WHERE terapeuta_id = '$OLD_TID';" 2>/dev/null || echo "?")
            echo "  Registros no banco antigo: $OLD_COUNT"

            psql "$NEW_DB" -c "ALTER TABLE public.\"$TABLE\" DISABLE ROW LEVEL SECURITY;" 2>/dev/null

            pg_dump "$OLD_DB" \
              --data-only \
              --inserts \
              --table="public.$TABLE" \
              --no-owner \
              --no-privileges \
              2>/dev/null | \
              grep "^INSERT INTO" | \
              sed "s/$OLD_TID/$NEW_TID/g" | \
              awk '{sub(/;$/, " ON CONFLICT DO NOTHING;"); print}' | \
              psql "$NEW_DB" 2>&1 | grep -v "^INSERT" | grep -v "^$" | head -10

            psql "$NEW_DB" -c "ALTER TABLE public.\"$TABLE\" ENABLE ROW LEVEL SECURITY;" 2>/dev/null

            NEW_COUNT=$(psql "$NEW_DB" -t -A -c \
              "SELECT COUNT(*) FROM public.\"$TABLE\" WHERE terapeuta_id = '$NEW_TID';" 2>/dev/null || echo "?")
            echo "  ✅ $TABLE: $NEW_COUNT registros importados"
          done

      - name: Migrar tabelas com paciente_id sem terapeuta_id
        env:
          OLD_DB: ${{ secrets.SUPABASE_OLD_DB_URL }}
          NEW_DB: ${{ secrets.SUPABASE_DB_URL }}
          OLD_TID: "808647e5-1d3b-4e3a-8886-d835b1117e2c"
        run: |
          set +e
          echo "=== Tabelas com paciente_id mas sem terapeuta_id ==="

          TABLES=$(psql "$OLD_DB" -t -A -c "
            SELECT c1.table_name
            FROM information_schema.columns c1
            WHERE c1.column_name = 'paciente_id'
              AND c1.table_schema = 'public'
              AND c1.table_name NOT IN (
                SELECT table_name FROM information_schema.columns
                WHERE column_name = 'terapeuta_id' AND table_schema = 'public'
              )
              AND c1.table_name NOT IN ('pacientes', 'agendamentos')
            ORDER BY c1.table_name;
          ")

          echo "Tabelas encontradas:"
          echo "$TABLES"

          for TABLE in $TABLES; do
            echo ""
            echo "=== Migrando: $TABLE ==="

            OLD_COUNT=$(psql "$OLD_DB" -t -A -c \
              "SELECT COUNT(*) FROM public.\"$TABLE\" t
               JOIN public.pacientes p ON p.id = t.paciente_id
               WHERE p.terapeuta_id = '$OLD_TID';" 2>/dev/null || echo "?")
            echo "  Registros no banco antigo: $OLD_COUNT"

            psql "$NEW_DB" -c "ALTER TABLE public.\"$TABLE\" DISABLE ROW LEVEL SECURITY;" 2>/dev/null

            pg_dump "$OLD_DB" \
              --data-only \
              --inserts \
              --table="public.$TABLE" \
              --no-owner \
              --no-privileges \
              2>/dev/null | \
              grep "^INSERT INTO" | \
              awk '{sub(/;$/, " ON CONFLICT DO NOTHING;"); print}' | \
              psql "$NEW_DB" 2>&1 | grep -v "^INSERT" | grep -v "^$" | head -10

            psql "$NEW_DB" -c "ALTER TABLE public.\"$TABLE\" ENABLE ROW LEVEL SECURITY;" 2>/dev/null

            NEW_COUNT=$(psql "$NEW_DB" -t -A -c \
              "SELECT COUNT(*) FROM public.\"$TABLE\";" 2>/dev/null || echo "?")
            echo "  ✅ $TABLE: $NEW_COUNT registros importados"
          done

      - name: Resumo da migração
        if: always()
        env:
          NEW_DB: ${{ secrets.SUPABASE_DB_URL }}
          NEW_TID: "44266838-326c-452d-bebf-e617ac0f3470"
        run: |
          echo ""
          echo "=== RESUMO FINAL ==="
          echo "Pacientes:    $(psql "$NEW_DB" -t -A -c "SELECT COUNT(*) FROM public.pacientes WHERE terapeuta_id = '$NEW_TID';" 2>/dev/null)"
          echo "Agendamentos: $(psql "$NEW_DB" -t -A -c "SELECT COUNT(*) FROM public.agendamentos WHERE terapeuta_id = '$NEW_TID';" 2>/dev/null)"
