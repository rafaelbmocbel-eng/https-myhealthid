name: Migrar dados do projeto antigo

on:
  workflow_dispatch: {}

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar secrets configurados
        env:
          OLD_KEY: ${{ secrets.SUPABASE_OLD_SERVICE_ROLE_KEY }}
          NEW_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$OLD_KEY" ]; then
            echo "❌ ERRO: SUPABASE_OLD_SERVICE_ROLE_KEY não configurado!"
            echo ""
            echo "Como obter:"
            echo "  1. Supabase → projeto ANTIGO → Settings → API"
            echo "  2. Copie o valor de 'service_role' (em Project API keys)"
            echo "  3. Adicione no GitHub como secret SUPABASE_OLD_SERVICE_ROLE_KEY"
            exit 1
          fi
          if [ -z "$NEW_KEY" ]; then
            echo "❌ ERRO: SUPABASE_SERVICE_ROLE_KEY não configurado!"
            exit 1
          fi
          echo "✅ Ambos os secrets configurados"

      - name: Testar acesso ao projeto antigo
        env:
          OLD_URL: "https://rbzmojurvypksubeigbt.supabase.co"
          OLD_KEY: ${{ secrets.SUPABASE_OLD_SERVICE_ROLE_KEY }}
        run: |
          echo "Testando acesso ao projeto antigo..."
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $OLD_KEY" \
            -H "Authorization: Bearer $OLD_KEY" \
            "$OLD_URL/rest/v1/pacientes?limit=1")
          echo "HTTP status: $HTTP"
          if [ "$HTTP" != "200" ] && [ "$HTTP" != "206" ]; then
            echo "❌ Falha ao acessar projeto antigo (HTTP $HTTP)"
            echo "Verifique se a chave service_role está correta"
            exit 1
          fi
          echo "✅ Projeto antigo acessível"

      - name: Testar acesso ao projeto novo
        env:
          NEW_URL: "https://zxulglbcxehqplxainmz.supabase.co"
          NEW_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "Testando acesso ao projeto novo..."
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $NEW_KEY" \
            -H "Authorization: Bearer $NEW_KEY" \
            "$NEW_URL/rest/v1/pacientes?limit=1")
          echo "HTTP status: $HTTP"
          if [ "$HTTP" != "200" ] && [ "$HTTP" != "206" ]; then
            echo "❌ Falha ao acessar projeto novo (HTTP $HTTP)"
            exit 1
          fi
          echo "✅ Projeto novo acessível"

      - name: Descobrir tabelas disponíveis no projeto antigo
        env:
          OLD_URL: "https://rbzmojurvypksubeigbt.supabase.co"
          OLD_KEY: ${{ secrets.SUPABASE_OLD_SERVICE_ROLE_KEY }}
        run: |
          echo "Tabelas disponíveis via API:"
          curl -s \
            -H "apikey: $OLD_KEY" \
            -H "Authorization: Bearer $OLD_KEY" \
            "$OLD_URL/rest/v1/" | jq -r '.definitions | keys[]' | sort

      - name: Migrar pacientes e agendamentos primeiro
        env:
          OLD_URL: "https://rbzmojurvypksubeigbt.supabase.co"
          NEW_URL: "https://zxulglbcxehqplxainmz.supabase.co"
          OLD_KEY: ${{ secrets.SUPABASE_OLD_SERVICE_ROLE_KEY }}
          NEW_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OLD_TID: "808647e5-1d3b-4e3a-8886-d835b1117e2c"
          NEW_TID: "44266838-326c-452d-bebf-e617ac0f3470"
        run: |
          set +e

          for TABLE in pacientes agendamentos; do
            echo ""
            echo "=== Migrando: $TABLE ==="

            # Buscar TODOS os registros (sem filtro de terapeuta_id)
            # para garantir que nenhum paciente referenciado em FK fique faltando
            BODY=$(curl -s \
              -H "apikey: $OLD_KEY" \
              -H "Authorization: Bearer $OLD_KEY" \
              -H "Accept: application/json" \
              "$OLD_URL/rest/v1/$TABLE?select=*&limit=5000")

            COUNT=$(echo "$BODY" | jq 'length')
            echo "  📦 $COUNT registros encontrados"

            if [ "$COUNT" = "0" ] || [ -z "$COUNT" ]; then
              echo "  ⏭️  Nenhum registro — pulando"
              continue
            fi

            PAYLOAD_FILE=$(mktemp /tmp/payload_XXXXXX.json)
            # Forçar terapeuta_id = NEW_TID em todos os registros
            # (pacientes com outro terapeuta_id causariam FK error no novo projeto)
            echo "$BODY" | jq \
              --arg new "$NEW_TID" \
              '[.[] | .terapeuta_id = $new]' \
              > "$PAYLOAD_FILE"

            echo "  📤 Enviando $(wc -c < "$PAYLOAD_FILE") bytes..."

            RESULT=$(curl -s -o /tmp/curl_out.txt -w "%{http_code}" \
              -X POST \
              -H "apikey: $NEW_KEY" \
              -H "Authorization: Bearer $NEW_KEY" \
              -H "Content-Type: application/json" \
              -H "Prefer: resolution=merge-duplicates,return=minimal" \
              "$NEW_URL/rest/v1/$TABLE" \
              --data @"$PAYLOAD_FILE")

            rm -f "$PAYLOAD_FILE"

            if [ "$RESULT" = "200" ] || [ "$RESULT" = "201" ] || [ "$RESULT" = "204" ]; then
              echo "  ✅ $TABLE: $COUNT registros sincronizados (HTTP $RESULT)"
            else
              echo "  ❌ $TABLE: erro (HTTP $RESULT)"
              cat /tmp/curl_out.txt | head -c 800
              echo ""
            fi
          done

      - name: Migrar tabelas com terapeuta_id
        env:
          OLD_URL: "https://rbzmojurvypksubeigbt.supabase.co"
          NEW_URL: "https://zxulglbcxehqplxainmz.supabase.co"
          OLD_KEY: ${{ secrets.SUPABASE_OLD_SERVICE_ROLE_KEY }}
          NEW_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OLD_TID: "808647e5-1d3b-4e3a-8886-d835b1117e2c"
          NEW_TID: "44266838-326c-452d-bebf-e617ac0f3470"
        run: |
          set +e

          # Buscar IDs válidos no novo banco para filtrar FK inválidas
          echo "Carregando IDs válidos do banco novo..."
          NEW_PIDS=$(curl -s \
            -H "apikey: $NEW_KEY" \
            -H "Authorization: Bearer $NEW_KEY" \
            "$NEW_URL/rest/v1/pacientes?select=id&limit=10000" \
            | jq '[.[].id]')
          echo "  $(echo "$NEW_PIDS" | jq 'length') pacientes no banco novo"

          NEW_AIDS=$(curl -s \
            -H "apikey: $NEW_KEY" \
            -H "Authorization: Bearer $NEW_KEY" \
            "$NEW_URL/rest/v1/agendamentos?select=id&limit=10000" \
            | jq '[.[].id]')
          echo "  $(echo "$NEW_AIDS" | jq 'length') agendamentos no banco novo"

          TABLES="controle_sessoes notas_prontuario avaliacoes avaliacoes_identidade avaliacoes_resposta respostas_avaliacao_paciente myid_avaliacoes myid_acoes_checklist pagamentos_paciente pagamentos_paciente_auditoria paciente_servicos paciente_missoes config_agenda config_sessoes convenios agenda_lista_espera ausencias_terapeuta protocolos protocolo_templates tecnicas_tratamento planos pacotes_sessoes vendas repasse_config tiss_config tiss_guias tiss_lotes tracking_config notificacao_inteligente_config notificacao_regras perfis_profissionais"

          for TABLE in $TABLES; do
            echo ""
            echo "=== Verificando: $TABLE ==="

            RESPONSE=$(curl -s -w "\n%{http_code}" \
              -H "apikey: $OLD_KEY" \
              -H "Authorization: Bearer $OLD_KEY" \
              -H "Accept: application/json" \
              "$OLD_URL/rest/v1/$TABLE?terapeuta_id=eq.$OLD_TID&select=*&limit=5000")

            HTTP=$(echo "$RESPONSE" | tail -1)
            BODY=$(echo "$RESPONSE" | head -n -1)

            if [ "$HTTP" = "404" ] || [ "$HTTP" = "400" ]; then
              echo "  ⏭️  Tabela não existe ou sem coluna terapeuta_id — pulando"
              continue
            fi

            if [ "$HTTP" != "200" ] && [ "$HTTP" != "206" ]; then
              echo "  ⚠️  Erro HTTP $HTTP — pulando"
              continue
            fi

            COUNT=$(echo "$BODY" | jq 'length')
            echo "  📦 $COUNT registros encontrados no banco antigo"

            if [ "$COUNT" = "0" ] || [ -z "$COUNT" ]; then
              echo "  ⏭️  Nenhum registro — pulando"
              continue
            fi

            # Trocar terapeuta_id antigo pelo novo
            TRANSFORMED=$(echo "$BODY" | jq \
              --arg old "$OLD_TID" \
              --arg new "$NEW_TID" \
              '[.[] | .terapeuta_id = if .terapeuta_id == $old then $new else .terapeuta_id end]')

            PAYLOAD="$TRANSFORMED"

            # Filtrar paciente_id inválidos
            HAS_PID=$(echo "$BODY" | jq 'if length > 0 then .[0] | has("paciente_id") else false end')
            if [ "$HAS_PID" = "true" ]; then
              PAYLOAD=$(echo "$PAYLOAD" | jq \
                --argjson pids "$NEW_PIDS" \
                '[.[] | select(.paciente_id == null or (.paciente_id as $p | $pids | any(. == $p)))]')
              VALID=$(echo "$PAYLOAD" | jq 'length')
              SKIPPED=$((COUNT - VALID))
              [ "$SKIPPED" -gt 0 ] && echo "  ⚠️  $SKIPPED ignorados (paciente_id sem correspondência)"
            fi

            # Filtrar agendamento_id inválidos
            HAS_AID=$(echo "$BODY" | jq 'if length > 0 then .[0] | has("agendamento_id") else false end')
            if [ "$HAS_AID" = "true" ]; then
              BEFORE=$(echo "$PAYLOAD" | jq 'length')
              PAYLOAD=$(echo "$PAYLOAD" | jq \
                --argjson aids "$NEW_AIDS" \
                '[.[] | select(.agendamento_id == null or (.agendamento_id as $a | $aids | any(. == $a)))]')
              VALID=$(echo "$PAYLOAD" | jq 'length')
              SKIPPED=$((BEFORE - VALID))
              [ "$SKIPPED" -gt 0 ] && echo "  ⚠️  $SKIPPED ignorados (agendamento_id sem correspondência)"
            fi

            VALID=$(echo "$PAYLOAD" | jq 'length')
            if [ "$VALID" = "0" ]; then
              echo "  ⏭️  Nenhum registro válido após filtros — pulando"
              continue
            fi
            echo "  📤 Importando $VALID registros válidos..."

            PAYLOAD_FILE=$(mktemp /tmp/payload_XXXXXX.json)
            echo "$PAYLOAD" > "$PAYLOAD_FILE"

            RESULT=$(curl -s -o /tmp/curl_out.txt -w "%{http_code}" \
              -X POST \
              -H "apikey: $NEW_KEY" \
              -H "Authorization: Bearer $NEW_KEY" \
              -H "Content-Type: application/json" \
              -H "Prefer: resolution=merge-duplicates,return=minimal" \
              "$NEW_URL/rest/v1/$TABLE" \
              --data @"$PAYLOAD_FILE")

            rm -f "$PAYLOAD_FILE"

            if [ "$RESULT" = "200" ] || [ "$RESULT" = "201" ] || [ "$RESULT" = "204" ]; then
              echo "  ✅ $TABLE: importado com sucesso (HTTP $RESULT)"
            else
              echo "  ❌ $TABLE: erro ao importar (HTTP $RESULT)"
              cat /tmp/curl_out.txt | head -c 500
              echo ""
            fi
          done

      - name: Migrar tabelas com paciente_id (sem terapeuta_id direto)
        env:
          OLD_URL: "https://rbzmojurvypksubeigbt.supabase.co"
          NEW_URL: "https://zxulglbcxehqplxainmz.supabase.co"
          OLD_KEY: ${{ secrets.SUPABASE_OLD_SERVICE_ROLE_KEY }}
          NEW_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OLD_TID: "808647e5-1d3b-4e3a-8886-d835b1117e2c"
        run: |
          set +e

          # Buscar IDs dos pacientes do terapeuta no banco antigo
          echo "Buscando IDs dos pacientes do terapeuta..."
          PACIENTE_IDS_COMMA=$(curl -s \
            -H "apikey: $OLD_KEY" \
            -H "Authorization: Bearer $OLD_KEY" \
            "$OLD_URL/rest/v1/pacientes?terapeuta_id=eq.$OLD_TID&select=id&limit=5000" \
            | jq -r '[.[].id] | join(",")')

          echo "IDs de pacientes no banco antigo: $(echo "$PACIENTE_IDS_COMMA" | tr ',' '\n' | wc -l)"

          if [ -z "$PACIENTE_IDS_COMMA" ]; then
            echo "Nenhum paciente encontrado — pulando migração de subtabelas"
            exit 0
          fi

          # Buscar IDs de pacientes válidos no banco NOVO (para filtrar FK inválidas)
          echo "Carregando IDs de pacientes válidos no banco novo..."
          NEW_PIDS_JSON=$(curl -s \
            -H "apikey: $NEW_KEY" \
            -H "Authorization: Bearer $NEW_KEY" \
            "$NEW_URL/rest/v1/pacientes?select=id&limit=10000" \
            | jq '[.[].id]')
          echo "  $(echo "$NEW_PIDS_JSON" | jq 'length') pacientes no banco novo"

          # Tabelas clínicas com paciente_id mas sem terapeuta_id
          TABLES="historia_vida_paciente diagnosticos_paciente evolucao_paciente sinais_vitais antropometria body_composition health_metrics meal_logs water_logs sleep_logs daily_logs wearable_metricas_semanais wearable_sync_log planos_alimentares planos_fino prescricoes_exercicios prescricoes_paciente progresso_exercicios studio_execucoes studio_execucao_exercicios studio_medidas studio_notas studio_treinos studio_periodizacoes testes_funcionais_paciente escalas_psicologia links_agenda_paciente links_avaliacao links_rastreavel protocolo_tratamentos protocolo_progressao documentos_emitidos termos_consentimento atestados_medicos exames_importados medicamentos_catalogo myid_dimension_insights_cache funil_leads pesquisas_nps notificacoes recordatorios_24h evento_inscricoes evento_respostas eventos_clinicos_anatomicos"

          for TABLE in $TABLES; do
            echo ""
            echo "=== Verificando: $TABLE ==="

            RESPONSE=$(curl -s -w "\n%{http_code}" \
              -H "apikey: $OLD_KEY" \
              -H "Authorization: Bearer $OLD_KEY" \
              "$OLD_URL/rest/v1/$TABLE?paciente_id=in.($PACIENTE_IDS_COMMA)&select=*&limit=5000")

            HTTP=$(echo "$RESPONSE" | tail -1)
            BODY=$(echo "$RESPONSE" | head -n -1)

            if [ "$HTTP" = "404" ] || [ "$HTTP" = "400" ]; then
              echo "  ⏭️  Tabela não existe ou sem coluna paciente_id — pulando"
              continue
            fi

            if [ "$HTTP" != "200" ] && [ "$HTTP" != "206" ]; then
              echo "  ⚠️  Erro HTTP $HTTP — pulando"
              continue
            fi

            COUNT=$(echo "$BODY" | jq 'length' 2>/dev/null || echo "0")
            if [ "$COUNT" = "0" ] || [ -z "$COUNT" ]; then
              echo "  ⏭️  Nenhum registro — pulando"
              continue
            fi

            echo "  📦 $COUNT registros encontrados"

            # Filtrar paciente_id inválidos (que não existem no banco novo)
            PAYLOAD=$(echo "$BODY" | jq \
              --argjson pids "$NEW_PIDS_JSON" \
              '[.[] | select(.paciente_id == null or (.paciente_id as $p | $pids | any(. == $p)))]')
            VALID=$(echo "$PAYLOAD" | jq 'length')
            SKIPPED=$((COUNT - VALID))
            [ "$SKIPPED" -gt 0 ] && echo "  ⚠️  $SKIPPED ignorados (paciente_id sem correspondência no banco novo)"

            if [ "$VALID" = "0" ]; then
              echo "  ⏭️  Nenhum registro válido após filtro — pulando"
              continue
            fi

            echo "  📤 Importando $VALID registros válidos..."

            PAYLOAD_FILE=$(mktemp /tmp/payload_XXXXXX.json)
            echo "$PAYLOAD" > "$PAYLOAD_FILE"

            RESULT=$(curl -s -o /tmp/curl_out.txt -w "%{http_code}" \
              -X POST \
              -H "apikey: $NEW_KEY" \
              -H "Authorization: Bearer $NEW_KEY" \
              -H "Content-Type: application/json" \
              -H "Prefer: resolution=merge-duplicates,return=minimal" \
              "$NEW_URL/rest/v1/$TABLE" \
              --data @"$PAYLOAD_FILE")

            rm -f "$PAYLOAD_FILE"

            if [ "$RESULT" = "200" ] || [ "$RESULT" = "201" ] || [ "$RESULT" = "204" ]; then
              echo "  ✅ $TABLE: $VALID registros importados (HTTP $RESULT)"
            else
              echo "  ❌ $TABLE: erro (HTTP $RESULT)"
              cat /tmp/curl_out.txt | head -c 400
              echo ""
            fi
          done

      - name: Resumo final
        if: always()
        env:
          NEW_URL: "https://zxulglbcxehqplxainmz.supabase.co"
          NEW_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEW_TID: "44266838-326c-452d-bebf-e617ac0f3470"
        run: |
          echo ""
          echo "======================================="
          echo "         RESUMO DA MIGRAÇÃO"
          echo "======================================="

          # Tabelas com terapeuta_id
          for TABLE in pacientes agendamentos controle_sessoes notas_prontuario avaliacoes pagamentos_paciente; do
            COUNT=$(curl -s \
              -H "apikey: $NEW_KEY" \
              -H "Authorization: Bearer $NEW_KEY" \
              "$NEW_URL/rest/v1/$TABLE?terapeuta_id=eq.$NEW_TID&select=id&limit=10000" \
              | jq 'length // "?"' 2>/dev/null || echo "?")
            printf "  %-35s %s registros\n" "$TABLE:" "$COUNT"
          done

          # Tabelas com paciente_id (count geral)
          for TABLE in historia_vida_paciente diagnosticos_paciente evolucao_paciente sinais_vitais planos_alimentares myid_avaliacoes myid_acoes_checklist respostas_avaliacao_paciente protocolo_tratamentos; do
            COUNT=$(curl -s \
              -H "apikey: $NEW_KEY" \
              -H "Authorization: Bearer $NEW_KEY" \
              "$NEW_URL/rest/v1/$TABLE?select=id&limit=10000" \
              | jq 'length // "?"' 2>/dev/null || echo "?")
            printf "  %-35s %s registros\n" "$TABLE:" "$COUNT"
          done
