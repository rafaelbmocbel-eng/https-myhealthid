name: Migrar dados do projeto antigo

on:
  workflow_dispatch: {}

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar secrets configurados
        env:
          OLD_KEY: ${{ secrets.SUPABASE_OLD_SERVICE_ROLE_KEY }}
          NEW_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$OLD_KEY" ]; then
            echo "❌ ERRO: SUPABASE_OLD_SERVICE_ROLE_KEY não configurado!"
            echo ""
            echo "Como obter:"
            echo "  1. Supabase → projeto ANTIGO → Settings → API"
            echo "  2. Copie o valor de 'service_role' (em Project API keys)"
            echo "  3. Adicione no GitHub como secret SUPABASE_OLD_SERVICE_ROLE_KEY"
            exit 1
          fi
          if [ -z "$NEW_KEY" ]; then
            echo "❌ ERRO: SUPABASE_SERVICE_ROLE_KEY não configurado!"
            exit 1
          fi
          echo "✅ Ambos os secrets configurados"

      - name: Testar acesso ao projeto antigo
        env:
          OLD_URL: "https://rbzmojurvypksubeigbt.supabase.co"
          OLD_KEY: ${{ secrets.SUPABASE_OLD_SERVICE_ROLE_KEY }}
        run: |
          echo "Testando acesso ao projeto antigo..."
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $OLD_KEY" \
            -H "Authorization: Bearer $OLD_KEY" \
            "$OLD_URL/rest/v1/pacientes?limit=1")
          echo "HTTP status: $HTTP"
          if [ "$HTTP" != "200" ] && [ "$HTTP" != "206" ]; then
            echo "❌ Falha ao acessar projeto antigo (HTTP $HTTP)"
            echo "Verifique se a chave service_role está correta"
            exit 1
          fi
          echo "✅ Projeto antigo acessível"

      - name: Testar acesso ao projeto novo
        env:
          NEW_URL: "https://zxulglbcxehqplxainmz.supabase.co"
          NEW_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "Testando acesso ao projeto novo..."
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $NEW_KEY" \
            -H "Authorization: Bearer $NEW_KEY" \
            "$NEW_URL/rest/v1/pacientes?limit=1")
          echo "HTTP status: $HTTP"
          if [ "$HTTP" != "200" ] && [ "$HTTP" != "206" ]; then
            echo "❌ Falha ao acessar projeto novo (HTTP $HTTP)"
            exit 1
          fi
          echo "✅ Projeto novo acessível"

      - name: Descobrir tabelas disponíveis no projeto antigo
        env:
          OLD_URL: "https://rbzmojurvypksubeigbt.supabase.co"
          OLD_KEY: ${{ secrets.SUPABASE_OLD_SERVICE_ROLE_KEY }}
        run: |
          echo "Tabelas disponíveis via API:"
          curl -s \
            -H "apikey: $OLD_KEY" \
            -H "Authorization: Bearer $OLD_KEY" \
            "$OLD_URL/rest/v1/" | jq -r '.definitions | keys[]' | sort

      - name: Migrar pacientes e agendamentos primeiro
        env:
          OLD_URL: "https://rbzmojurvypksubeigbt.supabase.co"
          NEW_URL: "https://zxulglbcxehqplxainmz.supabase.co"
          OLD_KEY: ${{ secrets.SUPABASE_OLD_SERVICE_ROLE_KEY }}
          NEW_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OLD_TID: "808647e5-1d3b-4e3a-8886-d835b1117e2c"
          NEW_TID: "44266838-326c-452d-bebf-e617ac0f3470"
        run: |
          set +e

          for TABLE in pacientes agendamentos; do
            echo ""
            echo "=== Migrando: $TABLE ==="

            # Buscar TODOS os registros (sem filtro de terapeuta_id)
            # para garantir que nenhum paciente referenciado em FK fique faltando
            BODY=$(curl -s \
              -H "apikey: $OLD_KEY" \
              -H "Authorization: Bearer $OLD_KEY" \
              -H "Accept: application/json" \
              "$OLD_URL/rest/v1/$TABLE?select=*&limit=5000")

            COUNT=$(echo "$BODY" | jq 'length')
            echo "  📦 $COUNT registros encontrados"

            if [ "$COUNT" = "0" ] || [ -z "$COUNT" ]; then
              echo "  ⏭️  Nenhum registro — pulando"
              continue
            fi

            PAYLOAD_FILE=$(mktemp /tmp/payload_XXXXXX.json)
            echo "$BODY" | jq \
              --arg old "$OLD_TID" \
              --arg new "$NEW_TID" \
              '[.[] | .terapeuta_id = if .terapeuta_id == $old then $new else .terapeuta_id end]' \
              > "$PAYLOAD_FILE"

            RESULT=$(curl -s -o /tmp/curl_out.txt -w "%{http_code}" \
              -X POST \
              -H "apikey: $NEW_KEY" \
              -H "Authorization: Bearer $NEW_KEY" \
              -H "Content-Type: application/json" \
              -H "Prefer: resolution=merge-duplicates,return=minimal" \
              "$NEW_URL/rest/v1/$TABLE" \
              --data @"$PAYLOAD_FILE")

            rm -f "$PAYLOAD_FILE"

            if [ "$RESULT" = "200" ] || [ "$RESULT" = "201" ] || [ "$RESULT" = "204" ]; then
              echo "  ✅ $TABLE: $COUNT registros sincronizados (HTTP $RESULT)"
            else
              echo "  ❌ $TABLE: erro (HTTP $RESULT)"
              cat /tmp/curl_out.txt | head -c 500
              echo ""
            fi
          done

      - name: Migrar tabelas com terapeuta_id
        env:
          OLD_URL: "https://rbzmojurvypksubeigbt.supabase.co"
          NEW_URL: "https://zxulglbcxehqplxainmz.supabase.co"
          OLD_KEY: ${{ secrets.SUPABASE_OLD_SERVICE_ROLE_KEY }}
          NEW_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OLD_TID: "808647e5-1d3b-4e3a-8886-d835b1117e2c"
          NEW_TID: "44266838-326c-452d-bebf-e617ac0f3470"
        run: |
          set +e

          # Tabelas que têm terapeuta_id (exceto as já migradas manualmente)
          TABLES="controle_sessoes notas_prontuario avaliacoes pagamentos_paciente paciente_servicos documentos anamneses evolucoes prontuarios myid fichas_evolucao registros_clinicos"

          for TABLE in $TABLES; do
            echo ""
            echo "=== Verificando: $TABLE ==="

            # Buscar registros do banco antigo filtrados por terapeuta_id
            RESPONSE=$(curl -s -w "\n%{http_code}" \
              -H "apikey: $OLD_KEY" \
              -H "Authorization: Bearer $OLD_KEY" \
              -H "Accept: application/json" \
              -H "Prefer: count=exact" \
              "$OLD_URL/rest/v1/$TABLE?terapeuta_id=eq.$OLD_TID&select=*&limit=5000")

            HTTP=$(echo "$RESPONSE" | tail -1)
            BODY=$(echo "$RESPONSE" | head -n -1)

            if [ "$HTTP" = "404" ] || [ "$HTTP" = "400" ]; then
              echo "  ⏭️  Tabela não existe ou sem coluna terapeuta_id — pulando"
              continue
            fi

            if [ "$HTTP" != "200" ] && [ "$HTTP" != "206" ]; then
              echo "  ⚠️  Erro HTTP $HTTP — pulando"
              continue
            fi

            COUNT=$(echo "$BODY" | jq 'length')
            echo "  📦 $COUNT registros encontrados no banco antigo"

            if [ "$COUNT" = "0" ] || [ -z "$COUNT" ]; then
              echo "  ⏭️  Nenhum registro — pulando"
              continue
            fi

            # Trocar terapeuta_id antigo pelo novo e gravar em arquivo
            PAYLOAD_FILE=$(mktemp /tmp/payload_XXXXXX.json)
            echo "$BODY" | jq \
              --arg old "$OLD_TID" \
              --arg new "$NEW_TID" \
              '[.[] | .terapeuta_id = if .terapeuta_id == $old then $new else .terapeuta_id end]' \
              > "$PAYLOAD_FILE"

            echo "  📤 Enviando $(wc -c < "$PAYLOAD_FILE") bytes..."

            # Inserir no banco novo com upsert — usar @file para evitar "Argument list too long"
            RESULT=$(curl -s -o /tmp/curl_out.txt -w "%{http_code}" \
              -X POST \
              -H "apikey: $NEW_KEY" \
              -H "Authorization: Bearer $NEW_KEY" \
              -H "Content-Type: application/json" \
              -H "Prefer: resolution=merge-duplicates,return=minimal" \
              "$NEW_URL/rest/v1/$TABLE" \
              --data @"$PAYLOAD_FILE")

            rm -f "$PAYLOAD_FILE"

            if [ "$RESULT" = "200" ] || [ "$RESULT" = "201" ] || [ "$RESULT" = "204" ]; then
              echo "  ✅ $TABLE: $COUNT registros importados (HTTP $RESULT)"
            else
              echo "  ❌ $TABLE: erro ao importar (HTTP $RESULT)"
              cat /tmp/curl_out.txt | head -c 500
              echo ""
            fi
          done

      - name: Migrar tabelas com paciente_id (sem terapeuta_id direto)
        env:
          OLD_URL: "https://rbzmojurvypksubeigbt.supabase.co"
          NEW_URL: "https://zxulglbcxehqplxainmz.supabase.co"
          OLD_KEY: ${{ secrets.SUPABASE_OLD_SERVICE_ROLE_KEY }}
          NEW_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OLD_TID: "808647e5-1d3b-4e3a-8886-d835b1117e2c"
        run: |
          set +e

          # Buscar IDs dos pacientes do terapeuta no banco antigo
          echo "Buscando IDs dos pacientes do terapeuta..."
          PACIENTE_IDS=$(curl -s \
            -H "apikey: $OLD_KEY" \
            -H "Authorization: Bearer $OLD_KEY" \
            "$OLD_URL/rest/v1/pacientes?terapeuta_id=eq.$OLD_TID&select=id&limit=5000" \
            | jq -r '.[].id')

          TOTAL_PACIENTES=$(echo "$PACIENTE_IDS" | wc -l)
          echo "Pacientes encontrados: $TOTAL_PACIENTES"

          if [ -z "$PACIENTE_IDS" ]; then
            echo "Nenhum paciente encontrado — pulando migração de subtabelas"
            exit 0
          fi

          # Tabelas que têm paciente_id mas não terapeuta_id
          TABLES="sessoes_avulsas historico_clinico arquivos_paciente contatos_emergencia"

          for TABLE in $TABLES; do
            echo ""
            echo "=== Verificando: $TABLE ==="

            ALL_RECORDS="[]"
            FOUND=0

            for PID in $PACIENTE_IDS; do
              RESPONSE=$(curl -s -w "\n%{http_code}" \
                -H "apikey: $OLD_KEY" \
                -H "Authorization: Bearer $OLD_KEY" \
                "$OLD_URL/rest/v1/$TABLE?paciente_id=eq.$PID&select=*&limit=1000")

              HTTP=$(echo "$RESPONSE" | tail -1)
              BODY=$(echo "$RESPONSE" | head -n -1)

              if [ "$HTTP" = "404" ] || [ "$HTTP" = "400" ]; then
                echo "  ⏭️  Tabela não existe — pulando"
                break
              fi

              COUNT=$(echo "$BODY" | jq 'length' 2>/dev/null || echo "0")
              if [ "$COUNT" != "0" ] && [ -n "$COUNT" ]; then
                FOUND=$((FOUND + COUNT))
                ALL_RECORDS=$(echo "$ALL_RECORDS $BODY" | jq -s 'add')
              fi
            done

            if [ "$FOUND" = "0" ]; then
              echo "  ⏭️  Nenhum registro — pulando"
              continue
            fi

            echo "  📦 $FOUND registros encontrados"

            PAYLOAD_FILE=$(mktemp /tmp/payload_XXXXXX.json)
            echo "$ALL_RECORDS" > "$PAYLOAD_FILE"

            RESULT=$(curl -s -o /tmp/curl_out.txt -w "%{http_code}" \
              -X POST \
              -H "apikey: $NEW_KEY" \
              -H "Authorization: Bearer $NEW_KEY" \
              -H "Content-Type: application/json" \
              -H "Prefer: resolution=merge-duplicates,return=minimal" \
              "$NEW_URL/rest/v1/$TABLE" \
              --data @"$PAYLOAD_FILE")

            rm -f "$PAYLOAD_FILE"

            if [ "$RESULT" = "200" ] || [ "$RESULT" = "201" ] || [ "$RESULT" = "204" ]; then
              echo "  ✅ $TABLE: $FOUND registros importados (HTTP $RESULT)"
            else
              echo "  ❌ $TABLE: erro ao importar (HTTP $RESULT)"
              cat /tmp/curl_out.txt | head -c 500
              echo ""
            fi
          done

      - name: Resumo final
        if: always()
        env:
          NEW_URL: "https://zxulglbcxehqplxainmz.supabase.co"
          NEW_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEW_TID: "44266838-326c-452d-bebf-e617ac0f3470"
        run: |
          echo ""
          echo "======================================="
          echo "         RESUMO DA MIGRAÇÃO"
          echo "======================================="

          for TABLE in pacientes agendamentos controle_sessoes notas_prontuario avaliacoes pagamentos_paciente paciente_servicos; do
            COUNT=$(curl -s \
              -H "apikey: $NEW_KEY" \
              -H "Authorization: Bearer $NEW_KEY" \
              "$NEW_URL/rest/v1/$TABLE?terapeuta_id=eq.$NEW_TID&select=id&limit=10000" \
              | jq 'length // "?" ' 2>/dev/null || echo "?")
            printf "  %-30s %s registros\n" "$TABLE:" "$COUNT"
          done
